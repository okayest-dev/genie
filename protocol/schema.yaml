# genie wire plugin protocol schema
# This is the source of truth for generating standalone Go plugin packages.
# Each plugin vendors the generated output as internal/wireplugin/.

protocol:
  version: 1
  package: wireplugin
  transport: stdio
  encoding: ndjson-rpc-2.0

constants:
  - name: MethodCapabilitiesList
    value: "capabilities/list"
  - name: MethodToolsList
    value: "tools/list"
  - name: MethodToolsCall
    value: "tools/call"
  - name: MethodWireInit
    value: "wire/init"
  - name: MethodWireStream
    value: "wire/stream"
  - name: MethodWireListModels
    value: "wire/list_models"
  - name: MethodContextBeforeRequest
    value: "context/before_request"
  - name: MethodContextAfterResponse
    value: "context/after_response"
  - name: MethodContextCompact
    value: "context/compact"
  - name: MethodContextCondense
    value: "context/condense"
  - name: MethodLifecycleRequestBuilt
    value: "lifecycle/request_built"
  - name: MethodLifecycleToolBefore
    value: "lifecycle/tool_before"
  - name: MethodLifecycleToolAfter
    value: "lifecycle/tool_after"
  - name: MethodLifecycleResponseReady
    value: "lifecycle/response_ready"
  - name: MethodLifecycleTurnError
    value: "lifecycle/turn_error"
  - name: MethodPing
    value: "ping"
  - name: MethodShutdown
    value: "shutdown"

error_codes:
  - name: ParseError
    value: -32700
  - name: InvalidRequest
    value: -32600
  - name: MethodNotFound
    value: -32601
  - name: InvalidParams
    value: -32602
  - name: InternalError
    value: -32603

types:
  - name: Request
    fields:
      - name: JSONRPC
        json: jsonrpc
        type: string
      - name: Method
        json: method
        type: string
      - name: Params
        json: params
        type: json.RawMessage
        omitempty: true
      - name: ID
        json: id
        type: any

  - name: Response
    fields:
      - name: JSONRPC
        json: jsonrpc
        type: string
      - name: Result
        json: result
        type: json.RawMessage
        omitempty: true
      - name: Error
        json: error
        type: "*Error"
        omitempty: true
      - name: ID
        json: id
        type: any

  - name: Error
    fields:
      - name: Code
        json: code
        type: int
      - name: Message
        json: message
        type: string

  - name: Capabilities
    fields:
      - name: Tools
        json: tools
        type: bool
      - name: Wires
        json: wires
        type: bool
      - name: Providers
        json: providers
        type: bool
      - name: BeforeRequest
        json: context_before
        type: bool
      - name: AfterResponse
        json: context_after
        type: bool
      - name: CompactHook
        json: context_compact
        type: bool
      - name: CondenseHook
        json: context_condense
        type: bool
      - name: LifecycleRequestBuilt
        json: lifecycle_request_built
        type: bool
      - name: LifecycleToolBefore
        json: lifecycle_tool_before
        type: bool
      - name: LifecycleToolAfter
        json: lifecycle_tool_after
        type: bool
      - name: LifecycleResponseReady
        json: lifecycle_response_ready
        type: bool
      - name: LifecycleTurnError
        json: lifecycle_turn_error
        type: bool
      - name: Version
        json: version
        type: int

  - name: WireInitResult
    fields:
      - name: OK
        json: ok
        type: bool

  - name: ModelDef
    fields:
      - name: ID
        json: id
        type: string
      - name: Name
        json: name
        type: string
        omitempty: true
      - name: ContextWindow
        json: context_window
        type: int
        omitempty: true

  - name: WireListModelsResult
    fields:
      - name: Models
        json: models
        type: "[]ModelDef"

  - name: ToolDef
    fields:
      - name: Name
        json: name
        type: string
      - name: Description
        json: description
        type: string
      - name: Parameters
        json: parameters
        type: "map[string]any"

  - name: ContextMessage
    fields:
      - name: Role
        json: role
        type: string
      - name: Content
        json: content
        type: string
      - name: ToolCalls
        json: tool_calls
        type: "[]ContextToolCall"
        omitempty: true
      - name: ToolCallID
        json: tool_call_id
        type: string
        omitempty: true

  - name: ContextToolCall
    fields:
      - name: ID
        json: id
        type: string
      - name: Name
        json: name
        type: string
      - name: Arguments
        json: arguments
        type: string

  - name: ContextRequest
    fields:
      - name: Model
        json: model
        type: string
      - name: Messages
        json: messages
        type: "[]ContextMessage"
      - name: Tools
        json: tools
        type: "[]ToolDef"
        omitempty: true

  - name: ContextBeforeRequestResult
    fields:
      - name: Request
        json: request
        type: ContextRequest

  - name: Usage
    fields:
      - name: PromptTokens
        json: prompt_tokens
        type: int
      - name: CompletionTokens
        json: completion_tokens
        type: int
      - name: TotalTokens
        json: total_tokens
        type: int

  - name: ContextAfterResponseParams
    fields:
      - name: Request
        json: request
        type: ContextRequest
      - name: Usage
        json: usage
        type: Usage

  - name: ContextAfterResponseResult
    fields:
      - name: Usage
        json: usage
        type: Usage

  - name: ContextCompactResult
    fields:
      - name: Request
        json: request
        type: ContextRequest

  - name: ContextCondenseResult
    fields:
      - name: Request
        json: request
        type: ContextRequest

  - name: LifecycleRequestBuiltResult
    fields:
      - name: Request
        json: request
        type: ContextRequest
      - name: Fatal
        json: fatal
        type: bool
        omitempty: true

  - name: LifecycleToolBeforeParams
    fields:
      - name: Name
        json: name
        type: string
      - name: ID
        json: id
        type: string
      - name: Arguments
        json: arguments
        type: string

  - name: LifecycleToolBeforeResult
    fields:
      - name: Arguments
        json: arguments
        type: string
      - name: Suppress
        json: suppress
        type: bool
        omitempty: true
      - name: Fatal
        json: fatal
        type: bool
        omitempty: true

  - name: LifecycleToolAfterParams
    fields:
      - name: Name
        json: name
        type: string
      - name: ID
        json: id
        type: string
      - name: Arguments
        json: arguments
        type: string
      - name: Result
        json: result
        type: string
      - name: Error
        json: error
        type: string
        omitempty: true

  - name: LifecycleToolAfterResult
    fields:
      - name: Result
        json: result
        type: string
      - name: Fatal
        json: fatal
        type: bool
        omitempty: true

  - name: LifecycleResponseReadyParams
    fields:
      - name: Chunk
        json: chunk
        type: string
      - name: Final
        json: final
        type: bool
        omitempty: true
      - name: FinishReason
        json: finish_reason
        type: string
        omitempty: true
      - name: Usage
        json: usage
        type: Usage
        omitempty: true

  - name: LifecycleResponseReadyResult
    fields:
      - name: Chunk
        json: chunk
        type: string
      - name: Fatal
        json: fatal
        type: bool
        omitempty: true

  - name: LifecycleTurnErrorParams
    fields:
      - name: Error
        json: error
        type: string
      - name: Phase
        json: phase
        type: string
      - name: Partial
        json: partial
        type: string
        omitempty: true

  - name: LifecycleTurnErrorResult
    fields:
      - name: Fatal
        json: fatal
        type: bool
        omitempty: true

handler:
  struct:
    fields:
      - name: scanner
        type: "*bufio.Scanner"
      - name: writer
        type: "*json.Encoder"
      - name: caps
        type: Capabilities
      - name: models
        type: "[]ModelDef"
      - name: onInit
        type: "func() error"
      - name: onStream
        type: "func(request json.RawMessage) (json.RawMessage, error)"
      - name: onBeforeRequest
        type: "func(request ContextRequest) (ContextRequest, error)"
      - name: onAfterResponse
        type: "func(request ContextRequest, usage Usage) (Usage, error)"
      - name: onCompact
        type: "func(request ContextRequest) (ContextRequest, error)"
      - name: onCondense
        type: "func(request ContextRequest) (ContextRequest, error)"
      - name: onLifecycleRequestBuilt
        type: "func(request ContextRequest) (LifecycleRequestBuiltResult, error)"
      - name: onLifecycleToolBefore
        type: "func(name, id, arguments string) (LifecycleToolBeforeResult, error)"
      - name: onLifecycleToolAfter
        type: "func(name, id, arguments, result, error string) (LifecycleToolAfterResult, error)"
      - name: onLifecycleResponseReady
        type: "func(chunk string, final bool, finishReason string, usage Usage) (LifecycleResponseReadyResult, error)"
      - name: onLifecycleTurnError
        type: "func(error, phase, partial string) (LifecycleTurnErrorResult, error)"

  methods:
    - name: SetModels
      receiver: "*Handler"
      params:
        - name: models
          type: "[]ModelDef"

    - name: OnInit
      receiver: "*Handler"
      params:
        - name: fn
          type: "func() error"

    - name: OnStream
      receiver: "*Handler"
      params:
        - name: fn
          type: "func(request json.RawMessage) (json.RawMessage, error)"

    - name: OnBeforeRequest
      receiver: "*Handler"
      params:
        - name: fn
          type: "func(request ContextRequest) (ContextRequest, error)"

    - name: OnAfterResponse
      receiver: "*Handler"
      params:
        - name: fn
          type: "func(request ContextRequest, usage Usage) (Usage, error)"

    - name: OnCompact
      receiver: "*Handler"
      params:
        - name: fn
          type: "func(request ContextRequest) (ContextRequest, error)"

    - name: OnCondense
      receiver: "*Handler"
      params:
        - name: fn
          type: "func(request ContextRequest) (ContextRequest, error)"

    - name: OnLifecycleRequestBuilt
      receiver: "*Handler"
      params:
        - name: fn
          type: "func(request ContextRequest) (LifecycleRequestBuiltResult, error)"

    - name: OnLifecycleToolBefore
      receiver: "*Handler"
      params:
        - name: fn
          type: "func(name, id, arguments string) (LifecycleToolBeforeResult, error)"

    - name: OnLifecycleToolAfter
      receiver: "*Handler"
      params:
        - name: fn
          type: "func(name, id, arguments, result, error string) (LifecycleToolAfterResult, error)"

    - name: OnLifecycleResponseReady
      receiver: "*Handler"
      params:
        - name: fn
          type: "func(chunk string, final bool, finishReason string, usage Usage) (LifecycleResponseReadyResult, error)"

    - name: OnLifecycleTurnError
      receiver: "*Handler"
      params:
        - name: fn
          type: "func(error, phase, partial string) (LifecycleTurnErrorResult, error)"

  # Methods that are not configurable - always generated as-is
  static_methods:
    - name: NewHandler
      params:
        - name: caps
          type: Capabilities
      returns:
        - "*Handler"

    - name: Run
      receiver: "*Handler"
      returns:
        - "error"

    - name: writeResult
      receiver: "*Handler"
      params:
        - name: id
          type: any
        - name: result
          type: any

    - name: writeRawResult
      receiver: "*Handler"
      params:
        - name: id
          type: any
        - name: raw
          type: json.RawMessage

    - name: writeError
      receiver: "*Handler"
      params:
        - name: id
          type: any
        - name: code
          type: int
        - name: message
          type: string

    - name: handleRequest
      receiver: "*Handler"
      params:
        - name: req
          type: "*Request"

  dispatch:
    - method: MethodCapabilitiesList
      action: "writeResult with caps"
    - method: MethodWireInit
      action: "call onInit, write WireInitResult{OK: true}"
    - method: MethodWireListModels
      action: "writeResult with WireListModelsResult{Models: models}"
    - method: MethodWireStream
      action: "call onStream with params, write raw result"
    - method: MethodContextBeforeRequest
      action: "call onBeforeRequest, write ContextBeforeRequestResult"
    - method: MethodContextAfterResponse
      action: "call onAfterResponse, write ContextAfterResponseResult"
    - method: MethodContextCompact
      action: "call onCompact, write ContextCompactResult"
    - method: MethodContextCondense
      action: "call onCondense, write ContextCondenseResult"
    - method: MethodLifecycleRequestBuilt
      action: "call onLifecycleRequestBuilt, write result"
    - method: MethodLifecycleToolBefore
      action: "call onLifecycleToolBefore, write result"
    - method: MethodLifecycleToolAfter
      action: "call onLifecycleToolAfter, write result"
    - method: MethodLifecycleResponseReady
      action: "call onLifecycleResponseReady, write result"
    - method: MethodLifecycleTurnError
      action: "call onLifecycleTurnError, write result"
    - method: MethodPing
      action: "writeResult with map[string]bool{\"pong\": true}"
    - method: MethodShutdown
      action: "writeResult with map[string]bool{\"ok\": true}, os.Exit(0)"
    - method: default
      action: "writeError -32601 \"method not found\""

parse_params:
  name: ParseParams
  generic: true
  params:
    - name: raw
      type: json.RawMessage
  returns:
    - "T"
    - "error"
