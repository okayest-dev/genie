version: 2

project_name: genie

builds:
  - main: ./cmd/genie
    binary: genie
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0

archives:
  - formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{.Tag}}-snapshot-{{.ShortCommit}}"

changelog:
  use: git