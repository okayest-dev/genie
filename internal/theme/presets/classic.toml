version = "1"
"$schema" = "https://genie.dev/schema/theme-v1.json"

# Classic preset - p10k-style connected segments with distinct backgrounds
# Each segment has its own background; powerline connectors () transition between them
# Segments: dir · git · provider · model · agent · time · tokens · prompt_char
# Glyph tiers: nerd/powerline/ascii
# REQUIRES: glyph_tier = "nerd" in config.toml AND a Nerd Font in your terminal

[roles]
# Salience ladder: content plain, harness chatter muted/tinted, problems coloured, security dialog bold
# Colours downconvert through render profile (ADR-0006); backgrounds added for prompt chips (ADR-0012)
# fg/bg/attrs/glyphs per role; missing keys fall back to plain (ADR-0009)

model = { fg = "", bg = "", attrs = [], glyphs = {} }
tool  = { fg = "cyan", bg = "", attrs = [], glyphs = {} }
error = { fg = "red", bg = "", attrs = [], glyphs = {} }
warning = { fg = "yellow", bg = "", attrs = [], glyphs = {} }
turn_cancelled = { fg = "", bg = "", attrs = ["dim"], glyphs = {} }
banner = { fg = "", bg = "", attrs = ["dim"], glyphs = {} }
log = { fg = "bright-black", bg = "", attrs = [], glyphs = {} }
prompt = { fg = "", bg = "", attrs = ["bold"], glyphs = {} }
pick = { fg = "", bg = "", attrs = [], glyphs = {} }
slash = { fg = "", bg = "", attrs = [], glyphs = {} }
plugin = { fg = "", bg = "", attrs = [], glyphs = {} }

# Prompt segment layout (ordered entries)
# Each entry: name, style (inline base style), options, states
# KEY: each segment has a DISTINCT background so powerline connectors are visible
# Using BRIGHT backgrounds with BLACK text for maximum contrast on dark terminals
[[segments]]
name = "dir"
style = { fg = "", bg = "", attrs = [], glyphs = {} }
options = { "dir.max_len" = "40", always = "false" }
  [segments.states]
  anchored = { fg = "black", bg = "bright-blue", attrs = ["bold"], glyphs = { nerd = "", powerline = "", ascii = "" } }
  shortened = { fg = "bright-black", bg = "bright-blue", attrs = ["dim"], glyphs = { nerd = "", powerline = "", ascii = "" } }

[[segments]]
name = "git"
style = { fg = "", bg = "", attrs = [], glyphs = {} }
options = { always = "false" }
  [segments.states]
  clean = { fg = "black", bg = "bright-green", attrs = ["bold"], glyphs = { nerd = "", powerline = "", ascii = "" } }
  dirty = { fg = "black", bg = "bright-yellow", attrs = ["bold"], glyphs = { nerd = "", powerline = "", ascii = "" } }
  unknown = { fg = "bright-black", bg = "bright-blue", attrs = ["dim"], glyphs = { nerd = "", powerline = "", ascii = "" } }

[[segments]]
name = "provider"
style = { fg = "black", bg = "bright-cyan", attrs = ["bold"], glyphs = {} }
options = { always = "false" }

[[segments]]
name = "model"
style = { fg = "black", bg = "bright-yellow", attrs = ["bold"], glyphs = {} }
options = { always = "false" }

[[segments]]
name = "agent"
style = { fg = "black", bg = "bright-magenta", attrs = ["bold"], glyphs = {} }
options = { always = "false" }

[[segments]]
name = "time"
style = { fg = "black", bg = "bright-red", attrs = ["bold"], glyphs = {} }
options = { "time.format" = "15:04:05", always = "false" }

[[segments]]
name = "tokens"
style = { fg = "black", bg = "bright-blue", attrs = ["bold"], glyphs = {} }
options = { always = "false" }

[[segments]]
name = "prompt_char"
style = { fg = "", bg = "", attrs = [], glyphs = {} }
options = { always = "true" }
  [segments.states]
  ok = { fg = "white", bg = "black", attrs = ["bold"], glyphs = { nerd = "❯", powerline = "❯", ascii = ">" } }
  error = { fg = "white", bg = "red", attrs = [], glyphs = { nerd = "✗", powerline = "✗", ascii = "!" } }
  cancelled = { fg = "bright-black", bg = "black", attrs = ["dim"], glyphs = { nerd = "⊘", powerline = "⊘", ascii = "?" } }

# Separators: powerline connectors between all segments (default)
# No overrides needed - every transition uses the connector
[separators]
default = { nerd = "", powerline = "", ascii = ">" }
overrides = {}

# Prompt config
[prompt]
split_threshold = 50